name: Build v3NetbillAgent

on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'v3NetbillAgent.sln'
  AGENT_SERVICE_PROJECT: 'Agent.Service/Agent.Service.csproj'
  AGENT_OVERLAY_PROJECT: 'Agent.Overlay/Agent.Overlay.csproj'
  WIX_VERSION: '4.0.5'
  MSI_OUT: 'v3NetbillAgentSetup.msi'

  # RustDesk untuk remote repair. Installer EXE-nya ikut THEREpack ke MSI,
  # lalu dijalankan senyap oleh custom action.
  #
  # ⚠️ Binari 24 MB TIDAK bisa di-commit (repo public + repo jadi besar),
  # jadi `.gitignore` menyingkirkan `Installer/RustDesk/`. Konsekuensinya CI
  # HARUS mengunduhnya sendiri — tanpa langkah ini, folder itu kosong di
  # runner dan `wix build` gagal dengan WIX0103 (sumber file tidak ketemu).
  #
  # SHA256 DIPIN, bukan diambil dari checksum yang diunduh bersama: kalau
  # checksummya ikut dari URL yang sama, verifikasi jadi tidak berarti
  # apa-apa. Nilai di bawah sudah dicocokkan dengan rilis resmi
  # rustdesk/rustdesk 1.4.9. Mengganti versi berarti mengganti KEDUA nilai.
  RUSTDESK_VERSION: '1.4.9'
  RUSTDESK_SHA256: 'eaedeb0088e687bf46f7c46a9c6ea5493ce51f3134dfd6acbedb47b5b9136274'

  # Base URL server untuk agent. Dipakai sebagai default kolom "Server URL"
  # di dialog installer, jadi MSI yang terpasang sudah benar sejak awal —
  # tidak perlu kasir mengetik ulang.
  #
  # ⚠️ Dulu nilai ini TIDAK pernah diteruskan ke `wix build`, sehingga MSI
  # selalu memakai default Product.wxs yaitu http://localhost:3000.
  # Agent lalu mencoba konek ke localhost di PC kasir, tidak pernah sampai
  # ke server: PC jadi OFFLINE dan wallpaper tidak pernah terunduh.
  # Fallback ke domain publik dipakai kalau variable repo belum diisi.
  SERVER_URL: ${{ vars.SERVER_URL }}


jobs:
  build-agent:
    name: Build Agent (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # ----- Checkout -----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----- Setup .NET 8 -----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ----- Restore -----
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
        working-directory: ${{ github.workspace }}

      # ----- Publish Agent.Service (self-contained win-x64) -----
      - name: Publish Agent.Service
        run: |
          dotnet publish ${{ env.AGENT_SERVICE_PROJECT }} `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o ${{ github.workspace }}/artifacts/Agent.Service
        working-directory: ${{ github.workspace }}

      # ----- Publish Agent.Overlay (self-contained win-x64) -----
      - name: Publish Agent.Overlay
        run: |
          dotnet publish ${{ env.AGENT_OVERLAY_PROJECT }} `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o ${{ github.workspace }}/artifacts/Agent.Overlay
        working-directory: ${{ github.workspace }}

      # ----- Pisahkan file "spesial" (exe/deps/runtimeconfig/appsettings) -----
      # agar generator dep fragment tidak menduplikasi file yang di-declare manual.
      - name: Prepare special files (exe/config)
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          foreach ($pair in @(
            @{ Src = "$ws/artifacts/Agent.Service"; Dst = "$ws/artifacts/Agent.Service.Special"; Exe = "Agent.Service" },
            @{ Src = "$ws/artifacts/Agent.Overlay"; Dst = "$ws/artifacts/Agent.Overlay.Special"; Exe = "Agent.Overlay" }
          )) {
            New-Item -ItemType Directory -Force -Path $pair.Dst | Out-Null
            foreach ($f in @("$($pair.Exe).exe", "$($pair.Exe).deps.json", "$($pair.Exe).runtimeconfig.json", "appsettings.json")) {
              if (Test-Path "$($pair.Src)/$f") { Move-Item "$($pair.Src)/$f" "$($pair.Dst)/$f" }
              else { Write-Error "File tidak ditemukan: $($pair.Src)/$f"; exit 1 }
            }
          }
          Write-Host "Special files prepared."

      # ----- Install WiX Toolset v4 + extensions -----
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add --global WixToolset.UI.wixext/${{ env.WIX_VERSION }}

      # ----- Generate dep fragments (wxs) dari sisa publish output -----
      - name: Generate dependency fragments
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          function New-DepFragment([string]$Dir, [string]$DirRef, [string]$Var, [string]$Cg, [string]$Out) {
            if (-not (Test-Path $Dir)) { Write-Error "Dir tidak ada: $Dir"; exit 1 }
            $files = Get-ChildItem -LiteralPath $Dir -Recurse -File
            $leaves = @{}
            foreach ($f in $files) {
              if ($leaves.ContainsKey($f.Name)) { continue }
              $leaves[$f.Name] = $true
            }
            $sb = New-Object System.Text.StringBuilder
            [void]$sb.AppendLine('<?xml version="1.0" encoding="UTF-8"?>')
            [void]$sb.AppendLine('<Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">')
            [void]$sb.AppendLine('  <Fragment>')
            [void]$sb.AppendLine("    <ComponentGroup Id=`"$Cg`">")
            $i = 0
            foreach ($f in $files) {
              if ($leaves.ContainsKey($f.Name)) { $leaves.Remove($f.Name) } else { continue }
              $rel = $f.FullName.Substring($Dir.Length + 1).Replace('\', '/')
              $src = "$Var$rel"
              [void]$sb.AppendLine("      <Component Id=`"c_${Cg}_${i}`" Directory=`"$DirRef`" Guid=`"*`">")
              [void]$sb.AppendLine("        <File Id=`"f_${Cg}_${i}`" Source=`"$src`" KeyPath=`"yes`" />")
              [void]$sb.AppendLine('      </Component>')
              $i++
            }
            [void]$sb.AppendLine('    </ComponentGroup>')
            [void]$sb.AppendLine('  </Fragment>')
            [void]$sb.AppendLine('</Wix>')
            Set-Content -LiteralPath $Out -Value $sb.ToString() -Encoding utf8
            Write-Host "$Out : $($files.Count) file"
          }

          New-DepFragment `
            -Dir "$ws/artifacts/Agent.Service" `
            -DirRef "SVCFOLDER" `
            -Var '$(var.SvcDepDir)' `
            -Cg "SvcDepComponents" `
            -Out "$ws/Installer/SvcDepFiles.wxs"

          New-DepFragment `
            -Dir "$ws/artifacts/Agent.Overlay" `
            -DirRef "OVERLAYFOLDER" `
            -Var '$(var.OverlayDepDir)' `
            -Cg "OverlayDepComponents" `
            -Out "$ws/Installer/OverlayDepFiles.wxs"

      # ----- Unduh RustDesk (binari, bukan teks — lihat catatan RUSTDESK_* di env) -----
      - name: Unduh RustDesk installer
        shell: pwsh
        run: |
          $dir = "${{ github.workspace }}/Installer/RustDesk"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $nama = "rustdesk-$env:RUSTDESK_VERSION-x86_64.exe"
          $out = Join-Path $dir $nama
          # URL dibangun dari versi, jadi naikkan versinya cukup di satu tempat.
          $url = "https://github.com/rustdesk/rustdesk/releases/download/$env:RUSTDESK_VERSION/$nama"

          Write-Host "Mengunduh $url"
          curl.exe -sL --retry 5 --retry-all-errors --max-time 900 -o $out $url
          if (-not (Test-Path $out)) { Write-Error "RustDesk gagal diunduh"; exit 1 }

          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToLowerInvariant()
          Write-Host "sha256: $sha  (harapan: $env:RUSTDESK_SHA256)"
          if ($sha -ne $env:RUSTDESK_SHA256) {
            Write-Error "SHA256 RustDesk tidak cocok. Jangan asal pakai — file ini dijalankan sebagai SYSTEM saat instalasi."
            exit 1
          }

          # NSIS, bukan file biasa: harus PE (MZ). M_Z check catching
          # halaman error GitHub yang tersimpan sebagai .exe.
          $head = [System.IO.File]::ReadAllBytes($out)[0..1]
          if (-not ($head[0] -eq 0x4D -and $head[1] -eq 0x5A)) {
            Write-Error "Berkas RustDesk bukan PE executable (MZ). Kemungkinan halaman error tersimpan."
            exit 1
          }
          Write-Host "RustDesk $env:RUSTDESK_VERSION siap ($((Get-Item $out).Length) byte)."

      # ----- Build MSI (wix build) -----
      - name: Build MSI
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          # ⚠️ Banner dialog installer memakai BINDER variable (-b), bukan -d.
          # Di WiX v4 WixUIBannerBmp dibaca lewat binder, dan nilainya harus
          # DIREKTORI yang berisi Banner.bmp — kalau diberi berkas langsung, wix
          # menolak dengan WIX0280. Cara lama WiX v3 (elemen <WixVariable>)
          # sudah tidak didukung dan ditolak WIX0005 di semua posisi.
          #
          # ⚠️ Komentar ini WAJIB di LUAR perintah berkutuk-backtick. Baris
          # komentar di tengah rangkaian backtick akan commenting-out seluruh
          # sisa baris logis, termasuk semua argumen setelahnya — bukan hanya
          # baris berikutnya.
          wix build `
            "$ws/Installer/Product.wxs" `
            "$ws/Installer/SvcDepFiles.wxs" `
            "$ws/Installer/OverlayDepFiles.wxs" `
            -arch x64 `
            -d SvcPublishDir="$ws/artifacts/Agent.Service.Special\" `
            -d SvcDepDir="$ws/artifacts/Agent.Service\" `
            -d OverlayPublishDir="$ws/artifacts/Agent.Overlay.Special\" `
            -d OverlayDepDir="$ws/artifacts/Agent.Overlay\" `
            -d licenseRtf="$ws/Installer/license.rtf" `
            -d RustDeskInstaller="$ws/Installer/RustDesk/rustdesk-$env:RUSTDESK_VERSION-x86_64.exe" `
            -d SERVER_URL="${{ env.SERVER_URL }}" `
            -b WixUIBannerBmp="$ws/Installer/Bitmaps" `
            -ext WixToolset.UI.wixext `
            -o "$ws/artifacts/${{ env.MSI_OUT }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MSI built:"
          Get-Item "$ws/artifacts/${{ env.MSI_OUT }}" | Select-Object Name, Length

      # ----- Verify MSI -----
      - name: Verify MSI contents
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          $msi = (Resolve-Path "$ws/artifacts/${{ env.MSI_OUT }}").Path
          Write-Host "MSI: $msi ($((Get-Item $msi).Length) bytes)"
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 0)
          $view = $db.OpenView("SELECT File.FileName, Directory.Directory FROM File, Component, Directory WHERE File.Component_ = Component.Component AND Component.Directory_ = Directory.Directory")
          $view.Execute()
          $files = @()
          while ($rec = $view.Fetch()) {
            $fileName = "$($rec.StringData(1))"
            if ($fileName.Contains('|')) { $fileName = $fileName.Split('|')[-1] }
            $files += "$($rec.StringData(2))\$fileName"
          }
          $view.Close()
          Write-Host ("Files in MSI: " + $files.Count)
          $servExe = $files | Where-Object { $_ -like '*Agent.Service.exe' }
          $ovlExe = $files | Where-Object { $_ -like '*Agent.Overlay.exe' }
          $cfg = $files | Where-Object { $_ -like '*appsettings.json' }
          if (-not $servExe) { Write-Error "Missing Agent.Service.exe di MSI"; exit 1 }
          if (-not $ovlExe) { Write-Error "Missing Agent.Overlay.exe di MSI"; exit 1 }
          if ($cfg.Count -lt 2) { Write-Error "appsettings.json < 2 di MSI"; exit 1 }
          # ⚠️ Kehadiran RustDesk di MSI HARUS dicek di sini. Build yang
          # sukses tidak menjamin apa pun: kalau langkah unduhnya dilewati
          # atau digest-nya tidak cocok, `wix build` berhenti duluan, tapi
          # kalau nanti ada langkah lain yang membuat foldernya kosong tanpa
          # menggagalkan build, MSI tetap terbit TANPA RustDesk — dan gejalanya
          # baru muncul saat kasir memasang di PC dan tidak menemukan RustDesk.
          $rustdesk = $files | Where-Object { $_ -like '*rustdesk-*-x86_64.exe' }
          if (-not $rustdesk) {
            Write-Error "RustDesk installer tidak ada di dalam MSI. Remote repair akan mati di semua PC."
            exit 1
          }
          Write-Host ("RustDesk di MSI: " + ($rustdesk -join ', '))
          $files | Sort-Object | ForEach-Object { Write-Host "   $_" }

          # --- ServerUrl HARUS benar, bukan sekadar file-nya ada ---
          # Default bawaan Product.wxs adalah http://localhost:3000. Kalau
          # nilai itu tidak tertimpa, agent akan mencoba konek ke localhost
          # di PC kasir: tidak pernah sampai ke server, PC jadi OFFLINE, dan
          # wallpaper tidak pernah terunduh. Gejalanya muncul jauh dari
          # penyebabnya, jadi di sini harus gagal keras, bukan lolos.
          $expected = "${{ env.SERVER_URL }}"
          $viewP = $db.OpenView("SELECT Value FROM Property WHERE Property = 'SERVER_URL'")
          $viewP.Execute()
          $actual = ""
          if ($recP = $viewP.Fetch()) { $actual = "$($recP.StringData(1))" }
          $viewP.Close()
          # --- Product/@Version WAJIB lebih baru dari yang terpasang ---
          # MSI ini dibuild ulang berkali-kali tanpa menaikkan versi, jadi
          # semuanya tercatat sebagai angka yang sama dan mustahil diketahui
          # mana yang benar-benar terpasang di PC.
          # ⚠️ Nama property-nya ProductVersion, BUKAN Version. Versi
          # kali dicoba dengan 'Version' dan hasilnya kosong — check-nya jadi
          # tidak pernah gagal sama sekali, persis jenis bug yang seharusnya
          # diceknya. Karena itu versi KOSONG juga dianggap gagal.
          $viewV = $db.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
          $viewV.Execute()
          $versi = ""
          if ($recV = $viewV.Fetch()) { $versi = "$($recV.StringData(1))" }
          $viewV.Close()
          Write-Host "ProductVersion di MSI: '$versi'"
          if ([string]::IsNullOrWhiteSpace($versi)) {
            Write-Error "ProductVersion tidak terbaca dari MSI. Check ini tidak berguna bila kosong."
            exit 1
          }

          # ⚠️ Dulu check ini `if ($versi -eq '1.0.9.0')` — konstanta basi.
          # Yang terjadi nyata: versi naik terus sampai 1.0.19.0, lalu
          # berhenti. MSI berikutnya yang isinya BERUBAH tetap lolos karena
          # 1.0.19.0 bukan 1.0.9.0. Gejalanya di server nyata: tanggal upload
          # berubah, size & sha256 ikut berubah, tapi ProductVersion di
          # Pengaturan tetap 1.0.19.0 — jadi mustahil membuktikan MSI yang
          # terpasang benar-benar yang terbaru.
          # Sekarang pembandingnya adalah versi yang SEDANG terpasang di
          # backend, jadi angka yang sama persis akan menggagalkan build.
          $bUrl  = "${{ secrets.V3NETBILL_BACKEND_URL }}"
          $bUser = "${{ secrets.V3NETBILL_ADMIN_USER }}"
          $bPass = "${{ secrets.V3NETBILL_ADMIN_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($bUrl) -or
              [string]::IsNullOrWhiteSpace($bUser) -or
              [string]::IsNullOrWhiteSpace($bPass)) {
            # Jangan diam-diam lolos. Guard ini butuh backend, dan tanpa
            # kredensial dia tidak menjalankan apa pun — greenscreen di sini
            # berarti "tidak diperiksa", bukan "berhasil diperiksa".
            Write-Warning "GUARD VERSI MATI: secret V3NETBILL_BACKEND_URL / V3NETBILL_ADMIN_USER / V3NETBILL_ADMIN_PASSWORD belum diisi, jadi versi MSI TIDAK dibandingkan dengan server."
            Write-Warning "Isi ketiganya di repo Settings > Secrets, lalu build ulang.(product/@Version di Installer/Product.wxs tetap wajib dinaikkan manual.)"
          } else {
            try {
              $login = Invoke-RestMethod -Method Post -Uri "$bUrl/api/auth/login" `
                -ContentType 'application/json' -TimeoutSec 60 `
                -Body (@{ username = $bUser; password = $bPass } | ConvertTo-Json)
              $jwt = $login.access_token
              if ([string]::IsNullOrWhiteSpace($jwt)) { throw "login backend tidak mengembalikan access_token" }

              $info = Invoke-RestMethod -Method Get -Uri "$bUrl/api/settings/installer/info" `
                -Headers @{ Authorization = "Bearer $jwt" } -TimeoutSec 60

              $terpasang = "$($info.versionName)"
              Write-Host "ProductVersion di server: '$terpasang' (sha256 $($info.sha256))"

              if ([string]::IsNullOrWhiteSpace($terpasang)) {
                Write-Host "Server belum punya MSI — tidak ada yang perlu dibandingkan."
              } elseif ([version]$versi -le [version]$terpasang) {
                # Format ProductVersion persis format [version] .NET
                # (major.minor.build.revision), jadi bisa dibandingkan langsung.
                Write-Error "Product/@Version ($versi) bukan lebih baru dari yang terpasang di server ($terpasang). Naikkan di Installer/Product.wxs."
                exit 1
              } else {
                Write-Host "Versi MSI ($versi) lebih baru dari server ($terpasang). Lanjut."
              }
            } catch {
              Write-Error "Tidak bisa membandingkan versi dengan server: $($_.Exception.Message)"
              exit 1
            }
          }

          Write-Host "SERVER_URL di MSI: '$actual' (harapan: '$expected')"
          if ([string]::IsNullOrWhiteSpace($actual) -or $actual -eq 'http://localhost:3000') {
            Write-Error "SERVER_URL di MSI kosong atau masih localhost:3000. Agent tidak akan konek. Set GitHub Actions variable SERVER_URL."
            exit 1
          }
          if ($actual -ne $expected) {
            Write-Error "SERVER_URL di MSI tidak sama dengan yang diharapkan ('$actual' != '$expected')"
            exit 1
          }

          Write-Host "MSI verification passed."

      # ----- Upload Artifact -----
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3NetbillAgentSetup
          path: ${{ github.workspace }}/artifacts/${{ env.MSI_OUT }}
          retention-days: 30

      # ----- Unggah ke backend: PINDAH KE SERVER, BUKAN DI SINI -----
      # DIHAPUS 11 Okt 2026. Runner GitHub tidak bisa mengunggah MSI ke backend:
      #
      #   1. Cloudflare membalas 403 ke runner. Penyebabnya Bot Fight Mode.
      #   2. Setelah dimatikan, upload 64 MB kena batas 100 detik Cloudflare
      #      dan dibalas 524, karena koneksi runner ke internet ~100 KB/s
      #      sehingga butuh sekitar 640 detik.
      #
      # Self-hosted runner tidak bisa menutup ini: workflow ini tetap butuh
      # windows-latest karena targetnya net8.0-windows + UseWPF + WiX.
      #
      # Yang menggantikannya: script `sinkron-agent-msi` di server produksi
      # (/home/warnet/docker/v3netbill/). Dia menarik artifact dari run ini,
      # lalu mengunggah ke http://127.0.0.1:3000 — tidak melewati Cloudflare,
      # jadi cepat dan tidak pernah kena 403/524. Dijalankan tiap 20 menit
      # lewat crontab, dan hanya mengunggah kalau versinya benar-benar beda.
      #
      # Kalau satu MSI ini yang harus segera sampai sebelum jadwal cron, jalankan
      # manual dari server:
      #   /home/warnet/docker/v3netbill/sinkron-agent-msi