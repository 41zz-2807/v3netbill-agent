name: Build v3NetbillAgent

on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'v3NetbillAgent.sln'
  AGENT_SERVICE_PROJECT: 'Agent.Service/Agent.Service.csproj'
  AGENT_OVERLAY_PROJECT: 'Agent.Overlay/Agent.Overlay.csproj'
  WIX_VERSION: '4.0.5'
  MSI_OUT: 'v3NetbillAgentSetup.msi'

jobs:
  build-agent:
    name: Build Agent (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # ----- Checkout -----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----- Setup .NET 8 -----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ----- Restore -----
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
        working-directory: ${{ github.workspace }}

      # ----- Publish Agent.Service (self-contained win-x64) -----
      - name: Publish Agent.Service
        run: |
          dotnet publish ${{ env.AGENT_SERVICE_PROJECT }} `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o ${{ github.workspace }}/artifacts/Agent.Service
        working-directory: ${{ github.workspace }}

      # ----- Publish Agent.Overlay (self-contained win-x64) -----
      - name: Publish Agent.Overlay
        run: |
          dotnet publish ${{ env.AGENT_OVERLAY_PROJECT }} `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o ${{ github.workspace }}/artifacts/Agent.Overlay
        working-directory: ${{ github.workspace }}

      # ----- Pisahkan file "spesial" (exe/deps/runtimeconfig/appsettings) -----
      # agar generator dep fragment tidak menduplikasi file yang di-declare manual.
      - name: Prepare special files (exe/config)
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          foreach ($pair in @(
            @{ Src = "$ws/artifacts/Agent.Service"; Dst = "$ws/artifacts/Agent.Service.Special"; Exe = "Agent.Service" },
            @{ Src = "$ws/artifacts/Agent.Overlay"; Dst = "$ws/artifacts/Agent.Overlay.Special"; Exe = "Agent.Overlay" }
          )) {
            New-Item -ItemType Directory -Force -Path $pair.Dst | Out-Null
            foreach ($f in @("$($pair.Exe).exe", "$($pair.Exe).deps.json", "$($pair.Exe).runtimeconfig.json", "appsettings.json")) {
              if (Test-Path "$($pair.Src)/$f") { Move-Item "$($pair.Src)/$f" "$($pair.Dst)/$f" }
              else { Write-Error "File tidak ditemukan: $($pair.Src)/$f"; exit 1 }
            }
          }
          Write-Host "Special files prepared."

      # ----- Install WiX Toolset v4 + extensions -----
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add --global WixToolset.UI.wixext/${{ env.WIX_VERSION }}

      # ----- Generate dep fragments (wxs) dari sisa publish output -----
      - name: Generate dependency fragments
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          function New-DepFragment([string]$Dir, [string]$DirRef, [string]$Var, [string]$Cg, [string]$Out) {
            if (-not (Test-Path $Dir)) { Write-Error "Dir tidak ada: $Dir"; exit 1 }
            $files = Get-ChildItem -LiteralPath $Dir -Recurse -File
            $leaves = @{}
            foreach ($f in $files) {
              if ($leaves.ContainsKey($f.Name)) { continue }
              $leaves[$f.Name] = $true
            }
            $sb = New-Object System.Text.StringBuilder
            [void]$sb.AppendLine('<?xml version="1.0" encoding="UTF-8"?>')
            [void]$sb.AppendLine('<Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">')
            [void]$sb.AppendLine('  <Fragment>')
            [void]$sb.AppendLine("    <ComponentGroup Id=`"$Cg`">")
            $i = 0
            foreach ($f in $files) {
              if ($leaves.ContainsKey($f.Name)) { $leaves.Remove($f.Name) } else { continue }
              $rel = $f.FullName.Substring($Dir.Length + 1).Replace('\', '/')
              $src = "$Var$rel"
              [void]$sb.AppendLine("      <Component Id=`"c_${Cg}_${i}`" Directory=`"$DirRef`" Guid=`"*`">")
              [void]$sb.AppendLine("        <File Id=`"f_${Cg}_${i}`" Source=`"$src`" KeyPath=`"yes`" />")
              [void]$sb.AppendLine('      </Component>')
              $i++
            }
            [void]$sb.AppendLine('    </ComponentGroup>')
            [void]$sb.AppendLine('  </Fragment>')
            [void]$sb.AppendLine('</Wix>')
            Set-Content -LiteralPath $Out -Value $sb.ToString() -Encoding utf8
            Write-Host "$Out : $($files.Count) file"
          }

          New-DepFragment `
            -Dir "$ws/artifacts/Agent.Service" `
            -DirRef "SVCFOLDER" `
            -Var '$(var.SvcDepDir)' `
            -Cg "SvcDepComponents" `
            -Out "$ws/Installer/SvcDepFiles.wxs"

          New-DepFragment `
            -Dir "$ws/artifacts/Agent.Overlay" `
            -DirRef "OVERLAYFOLDER" `
            -Var '$(var.OverlayDepDir)' `
            -Cg "OverlayDepComponents" `
            -Out "$ws/Installer/OverlayDepFiles.wxs"

      # ----- Build MSI (wix build) -----
      - name: Build MSI
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          wix build `
            "$ws/Installer/Product.wxs" `
            "$ws/Installer/SvcDepFiles.wxs" `
            "$ws/Installer/OverlayDepFiles.wxs" `
            -d SvcPublishDir="$ws/artifacts/Agent.Service.Special\" `
            -d SvcDepDir="$ws/artifacts/Agent.Service\" `
            -d OverlayPublishDir="$ws/artifacts/Agent.Overlay.Special\" `
            -d OverlayDepDir="$ws/artifacts/Agent.Overlay\" `
            -d licenseRtf="$ws/Installer/license.rtf" `
            -ext WixToolset.UI.wixext `
            -o "$ws/artifacts/${{ env.MSI_OUT }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MSI built:"
          Get-Item "$ws/artifacts/${{ env.MSI_OUT }}" | Select-Object Name, Length

      # ----- Verify MSI -----
      - name: Verify MSI contents
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          $msi = (Resolve-Path "$ws/artifacts/${{ env.MSI_OUT }}").Path
          Write-Host "MSI: $msi ($((Get-Item $msi).Length) bytes)"
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 0)
          $view = $db.OpenView("SELECT File.FileName, Directory.Directory FROM File, Component, Directory WHERE File.Component_ = Component.Component AND Component.Directory_ = Directory.Directory")
          $view.Execute()
          $files = @()
          while ($rec = $view.Fetch()) {
            $fileName = "$($rec.StringData(1))"
            if ($fileName.Contains('|')) { $fileName = $fileName.Split('|')[-1] }
            $files += "$($rec.StringData(2))\$fileName"
          }
          $view.Close()
          Write-Host ("Files in MSI: " + $files.Count)
          $servExe = $files | Where-Object { $_ -like '*Agent.Service.exe' }
          $ovlExe = $files | Where-Object { $_ -like '*Agent.Overlay.exe' }
          $cfg = $files | Where-Object { $_ -like '*appsettings.json' }
          if (-not $servExe) { Write-Error "Missing Agent.Service.exe di MSI"; exit 1 }
          if (-not $ovlExe) { Write-Error "Missing Agent.Overlay.exe di MSI"; exit 1 }
          if ($cfg.Count -lt 2) { Write-Error "appsettings.json < 2 di MSI"; exit 1 }
          $files | Sort-Object | ForEach-Object { Write-Host "   $_" }
          Write-Host "MSI verification passed."

      # ----- Upload Artifact -----
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3NetbillAgentSetup
          path: ${{ github.workspace }}/artifacts/${{ env.MSI_OUT }}
          retention-days: 30

      # ----- Auto-upload MSI ke Backend (panel admin > Pengaturan > Installer) -----
      - name: Upload MSI to Backend
        env:
          V3NETBILL_BACKEND_URL: ${{ secrets.V3NETBILL_BACKEND_URL }}
          V3NETBILL_ADMIN_USER: ${{ secrets.V3NETBILL_ADMIN_USER }}
          V3NETBILL_ADMIN_PASSWORD: ${{ secrets.V3NETBILL_ADMIN_PASSWORD }}
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          if ([string]::IsNullOrEmpty($env:V3NETBILL_ADMIN_USER)) {
            Write-Host "Secret V3NETBILL_ADMIN_USER belum diatur; lewati upload."; exit 0
          }
          try {
            $login = Invoke-RestMethod -Method Post `
              -Uri "$env:V3NETBILL_BACKEND_URL/api/auth/login" `
              -ContentType "application/json" `
              -Body (@{ username = $env:V3NETBILL_ADMIN_USER; password = $env:V3NETBILL_ADMIN_PASSWORD } | ConvertTo-Json)
          } catch {
            Write-Host "Gagal login backend: $($_.Exception.Message)"; exit 1
          }
          $token = $login.access_token
          $msi = "$ws/artifacts/${{ env.MSI_OUT }}"
          curl.exe -sS -f -o "$ws/upload-result.json" `
            -X POST "$env:V3NETBILL_BACKEND_URL/api/settings/installer" `
            -H "Authorization: Bearer $token" `
            -F "file=@${msi};type=application/vnd.ms-installer"
          if ($LASTEXITCODE -ne 0) { Write-Host "Upload gagal"; exit 1 }
          Write-Host "MSI berhasil di-upload ke backend:"
          Get-Content "$ws/upload-result.json"